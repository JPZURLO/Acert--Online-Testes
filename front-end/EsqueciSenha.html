<!DOCTYPE html>
<html>
<head>
  <title>Tela de Login</title>
    <link rel="stylesheet" href="./css/login.css?v=2">
    <link rel="stylesheet" href="./css/public-i18n.css?v=1">
  
</head>
<body>
  <div class="container">
    <div class="login-box">
      <img src="./assets/images/iconeUser.png" alt="Ícone do Usuário" class="user-icon">
      <h2>Esqueci a Senha</h2>
      <p>Digite seu endereço de e-mail para redefinir sua senha.</p>
      <form id="password-reset-form">
        <input id="password-reset-email" name="email" type="email" placeholder="E-mail" class="input-field" autocomplete="email" required>
        <button class="reset-button" id="password-reset-button" type="submit">Redefinir Senha</button>
      </form>
      <p id="password-reset-message" class="login-message" aria-live="polite"></p>
      <a href="./login.html" class="esqueci-senha">Voltar para o login</a>
      
    </div>
  </div>

  <script src="./js/internal-i18n.js?v=1"></script>
  <script src="./js/public-i18n.js?v=1"></script>
  <script src="./js/password-reset.js?v=1"></script>
</body>
</html>
